name: Numerical reproduction

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python run_all.py
      - run: python analysis/refit_primary.py --check-reference
      - run: python analysis/refit_baselines.py --check-reference
